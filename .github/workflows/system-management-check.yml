name: System Management Check

on:
  push:
    branches: [master, main, develop, 'feature/**', 'fix/**']
    paths:
      - 'system-management/**'
      - 'system-support/**'
      - '.github/workflows/system-management-check.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'system-management/**'
      - 'system-support/**'
      - '.github/workflows/system-management-check.yml'

# Runner image is pinned deliberately: ubuntu-latest migrates to Ubuntu 26
# and would otherwise change the preinstalled toolchain silently.
jobs:
  native-build-and-test:
    name: Native build, typecheck and unit tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: system-management

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # This app does not ship a lockfile, so automatic dependency caching is disabled.
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        # Required by the Rust NAPI build (alsa-sys needs libasound2-dev,
        # plus pkg-config / libudev for other crates). Display deps for
        # e2e/smoke are intentionally omitted — those are manual-only now.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libv4l-dev libudev-dev

      - name: Install dependencies
        # Electron binary download stays skipped: browser e2e and Electron smoke
        # are manual-only checks (see TODO tasks 6/7), not CI gates. No lockfile;
        # the registry is pinned in system-management/.npmrc.
        # yt-dlp's postinstall downloads a binary via the unauthenticated GitHub
        # API and fails on shared-runner rate limits; CI never runs downloading
        # code, so skip it (the binary is only needed for manual video features).
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          YOUTUBE_DL_SKIP_DOWNLOAD: '1'
        run: npm install --legacy-peer-deps

      - name: Build native module
        run: npm run build:native

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run
