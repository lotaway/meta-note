name: System Management Check

on:
  push:
    branches: [master, main, develop, 'feature/**', 'fix/**']
    paths:
      - 'system-management/**'
      - 'system-support/**'
      - '.github/workflows/system-management-check.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'system-management/**'
      - 'system-support/**'
      - '.github/workflows/system-management-check.yml'

# Runner image is pinned deliberately: ubuntu-latest migrates to Ubuntu 26
# and would otherwise change the preinstalled toolchain silently.
jobs:
  native-build-and-test:
    name: Native build, typecheck, unit, e2e and Electron smoke
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: system-management

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # This app does not ship a lockfile, so automatic dependency caching is disabled.
          package-manager-cache: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build and display dependencies
        # alsa-sys needs libasound2-dev; pkg-config / libudev serve other crates.
        # xvfb + GTK/NSS stack let a real Electron window open on a headless
        # runner for the smoke test wrapped with xvfb-run below.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libv4l-dev libudev-dev \
            xvfb libgtk-3-0 libnss3 libxss1 libasound2t64 libgbm1 \
            libdrm2 libxkbcommon0 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2t64 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 \
            libx11-xcb1

      - name: Install dependencies
        # The Electron binary is required by the runtime smoke test, so its
        # download stays enabled. yt-dlp's postinstall uses the unauthenticated
        # GitHub API and fails under shared-runner rate limits; CI never runs
        # downloading code, so skip it. No lockfile; registry is pinned in .npmrc.
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: '1'
        run: npm install --legacy-peer-deps

      - name: Build native module
        run: npm run build:native

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # Run under the plain Node ABI, before better-sqlite3 is rebuilt for
        # Electron. Unit tests mock native modules and need the Node binding.
        run: npm run test:run

      - name: Build renderer and main process
        # Produces dist/index.html and dist-electron/main/desktop-main.js,
        # consumed by the browser e2e dev server and the Electron smoke.
        run: npm run build

      - name: Install Playwright browser
        # Chromium is only for the browser e2e suite; headless needs no xvfb.
        # Display libraries are already installed above.
        run: npx playwright install chromium

      - name: Browser e2e tests
        run: npm run test:e2e

      - name: Electron runtime smoke
        # Real Electron startup, window.desktop bridge and NAPI-RS module load
        # under a virtual display. Catches native-ABI or preload regressions.
        run: xvfb-run -a npm run test:smoke
